<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Throwables Mockups</title>
  <style>
    html, body { margin:0; padding:0; background:#0e0e1a; color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow:hidden; }
    canvas#g { display:block; width:100vw; height:100vh; }
    #header { position:fixed; top:12px; left:16px; z-index:10; pointer-events:none;
      font-size:14px; opacity:0.85; }
    #header b { font-size:18px; }
    #version { position:fixed; right:8px; bottom:8px; z-index:10;
      font-size:11px; font-weight:600; color:rgba(255,255,255,0.55);
      background:rgba(0,0,0,0.35); padding:3px 8px; border-radius:10px; }
    .label { position:absolute; transform:translate(-50%, 0);
      pointer-events:none; text-align:center;
      padding:6px 10px; background:rgba(0,0,0,0.6);
      border-radius:10px; font-size:12px; min-width:120px;
      backdrop-filter:blur(6px); }
    .label .name { font-weight:700; font-size:14px; }
    .label .meta { color:#aaa; font-size:11px; margin-top:2px; }
    .label .cost { color:#f1c40f; font-weight:700; margin-top:2px; }
  </style>
</head>
<body>
  <canvas id="g"></canvas>
  <div id="header"><b>Throwables Mockups</b> &nbsp;·&nbsp; six candidates rendered in-engine</div>
  <div id="labels"></div>
  <div id="version">v0.0.0</div>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="./src/mockups.js"></script>
</body>
</html>
