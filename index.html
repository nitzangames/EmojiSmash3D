<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>8-Bit Smash</title>
  <style>
    html, body { margin:0; padding:0; background:#0e0e1a; color:#fff;
      width:100vw; height:100vh; overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
    canvas#game { display:block; width:100vw; height:100vh; touch-action:none; }
    #hud { position:fixed; inset:0; pointer-events:none; }
    #hud > * { pointer-events:auto; }
    .hud-row { position: absolute; left: 0; right: 0; padding: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
    .hud-top    { top: 0; }
    .hud-bottom { bottom: 0; }
    .hud-label  { background: rgba(0,0,0,0.5); color: #fff; padding: 6px 12px; border-radius: 18px; font-weight: 600; font-size: 14px; }
    .hud-pips   { display: flex; gap: 4px; }
    .hud-pip    { width: 14px; height: 14px; border-radius: 50%; background: #555; box-shadow: inset 0 0 0 1px #888; }
    .hud-pip.full { background: #e94560; box-shadow: inset 0 0 0 1px #ff90a0; }
    .hud-btn    { background: rgba(0,0,0,0.6); color: #fff; border: 0; border-radius: 50%; width: 44px; height: 44px; font-size: 18px; cursor: pointer; }
    .hud-gold   { font-size: 14px; font-weight: 700; color: #f1c40f; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 18px; }
    .modal      { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 10; }
    .modal .panel { background: #1a1a2e; border-radius: 16px; padding: 28px 32px; min-width: 280px; text-align: center; }
    .modal h2   { margin: 0 0 12px; }
    .modal .stars { font-size: 36px; letter-spacing: 8px; margin: 8px 0 16px; }
    .modal button { display: block; margin: 8px auto; padding: 10px 24px; border: 0; border-radius: 10px; background: #e94560; color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; min-width: 200px; }
    .modal button.secondary { background: #444; }
    .screen { position: fixed; inset: 0; background: #0e0e1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; padding: 24px; }
    .screen h1 { font-size: 36px; margin: 0 0 8px; }
    .screen .sub { color: #888; margin: 0 0 32px; }
    .screen .menu-btn { display: block; min-width: 240px; margin: 8px 0; padding: 14px 22px; background: #e94560; color: #fff; border: 0; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; }
    .screen .menu-btn.secondary { background: #444; }
    .screen .menu-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
    .world-tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
    .world-tabs button { background: #1a1a2e; color: #ccc; border: 0; padding: 8px 14px; border-radius: 16px; cursor: pointer; font-size: 13px; }
    .world-tabs button.active { background: #e94560; color: #fff; }
    .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 500px; }
    .level-cell { background: #1a1a2e; border-radius: 12px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .level-cell img { width: 48px; height: 48px; image-rendering: pixelated; }
    .level-cell.locked { opacity: 0.3; cursor: not-allowed; }
    .level-cell .stars { font-size: 12px; color: #f1c40f; margin-top: 4px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <script src="./play-sdk.js"></script>
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/geometries/RoundedBoxGeometry.js": "./vendor/RoundedBoxGeometry.js",
        "physics3d": "./physics3d/index.js"
    } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
